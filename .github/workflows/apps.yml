name: Build desktop and Android apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  MRKIPLAY_WEB_URL: https://mrkiplay-3eep3u8b.manus.space

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer and portable app
        run: pnpm desktop:dist
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrkiplay-windows
          path: artifacts/desktop/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Android project and sync web shell
        run: pnpm mobile:init
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MrKiplay-android-${GITHUB_SHA::7}.apk"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrkiplay-android
          path: "MrKiplay-android-*.apk"
          if-no-files-found: error

  release-assets:
    name: Attach app packages to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mrkiplay-windows
          path: release-assets
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: mrkiplay-android
          path: release-assets
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
