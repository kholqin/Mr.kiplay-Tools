name: Mr.Kiplay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test -- --run

      - name: Production build
        run: pnpm build

      - name: Validate Unix installer syntax
        run: bash -n scripts/install/install.sh

  windows-installer:
    name: PowerShell installer on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Verify PowerShell installer help mode
        shell: pwsh
        run: |
          $output = & ./scripts/install/install.ps1 -Help
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch "Penggunaan") {
            throw "Help mode installer tidak mengembalikan usage yang diharapkan."
          }

      - name: Verify PowerShell installer log self-test
        shell: pwsh
        run: |
          $output = & ./scripts/install/install.ps1 -TestLog
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch "self-test lulus") {
            throw "Self-test log installer tidak lulus."
          }

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/install/install.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run PowerShell installer bootstrap
        shell: pwsh
        env:
          CI: true
        run: ./scripts/install/install.ps1

      - name: Upload PowerShell installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-installer-log
          path: |
            .mrkiplay/logs/install.log
            .mrkiplay/logs/install.log.1
          if-no-files-found: ignore
          retention-days: 7
